<!-- Ai365Lab AI 실험 번호 위젯: Blogger > 레이아웃 > 가젯 추가 > HTML/JavaScript 에 그대로 붙여넣기 -->
<div id="ai365-picks" style="font-family:'Malgun Gothic',sans-serif;background:#f6f3ff;border-radius:14px;padding:14px;color:#241a3d">불러오는 중…</div>
<script>
(function(){
  var SRC="https://codekimmy.github.io/lotto-ai365lab/ai-picks/public/latest_picks.json";
  var col=function(n){return ["#f2b705","#3b82f6","#ef4444","#6b7280","#22a06b"][Math.min(Math.floor((n-1)/10),4)]};
  var ball=function(n){return '<b style="display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:13px;margin:1px;background:'+col(n)+'">'+n+'</b>'};
  fetch(SRC+"?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    var h='<div style="font-size:12px;color:#7b4fd6;font-weight:700">'+d.badge+'</div>';
    if(d.next){
      h+='<div style="font-size:17px;font-weight:800;margin:4px 0 8px">'+d.next.draw+'회 AI 실험 번호 <span style="font-size:12px;font-weight:400">('+d.next.draw_date+' 추첨 · 로직 '+d.next.version+')</span></div>';
      d.next.sets.forEach(function(s){h+='<div style="margin:3px 0"><b style="color:#7b4fd6;margin-right:6px">'+s.label+'</b>'+s.nums.map(ball).join('')+'</div>'});
    }
    if(d.last_result){
      h+='<div style="font-size:13px;margin-top:8px">지난 '+d.last_result.draw+'회 채점: AI 5세트 일치 '+d.last_result.ai_total_matches+'개 · 무작위 5세트 '+d.last_result.random_total_matches+'개 · 기대값 4개</div>';
    }
    var t=d.track_record;
    h+='<div style="font-size:13px">누적 '+(t.draws?t.draws+'회 · 1장당 평균 일치 '+t.ai_mean+'개 (무작위 '+t.random_mean+' / 기대값 0.8)':t.note)+'</div>';
    h+='<div style="font-size:11px;color:#6b5f86;margin-top:8px">'+d.disclaimer+'</div>';
    document.getElementById('ai365-picks').innerHTML=h;
  }).catch(function(){document.getElementById('ai365-picks').textContent='번호를 불러오지 못했습니다.'});
})();
</script>
