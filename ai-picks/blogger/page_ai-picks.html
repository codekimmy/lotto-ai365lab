<!-- Ai365Lab AI 실험 번호 · 페이지 /p/ai-picks.html (HTML 보기)에 통째로 붙여넣기. 데이터: GitHub ai-picks/public/*.json (자동 갱신) -->
<div class="a3" id="a3-page">불러오는 중…</div>
<script>
var AI365=(function(){
  var BASE=(window.AI365_BASE||"https://raw.githubusercontent.com/codekimmy/lotto-ai365lab/main/ai-picks/public/");
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  // o.win: 당첨번호 배열이 있으면 맞은 번호는 검정 채움, 나머지는 흐리게 / o.bonus: 보너스 표시 / o.sm: 작은 공
  function ball(n,o){o=o||{};var c="a3-b";if(o.sm)c+=" a3-sm";
    if(o.bonus)c+=" a3-on";else if(o.win){c+=(o.win.indexOf(n)>=0?" a3-on":" a3-off")}
    return '<i class="'+c+'">'+n+'</i>'}
  function balls(a,o){return a.map(function(n){return ball(n,o)}).join("")}
  function get(f){return fetch(BASE+f+"?t="+Math.floor(Date.now()/300000)).then(function(r){if(!r.ok)throw r.status;return r.json()})}
  function date(s){return String(s).replace(/-/g,".")}
  var M='"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  var CSS='.a3{color:#111;line-height:1.55}.a3 *{box-sizing:border-box}'+
  '.a3-box{background:#fbf8f0;border:1px solid #111;padding:16px 18px;margin:0 0 16px}'+
  '.a3-k{font-family:'+M+';font-size:12px;letter-spacing:.04em;color:#555;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #111;padding-bottom:6px;margin-bottom:10px}'+
  '.a3-h{font-size:24px;font-weight:800;margin:2px 0 2px}.a3-h small{font-size:13px;font-weight:400;color:#555;margin-left:8px;font-family:'+M+'}'+
  '.a3-r{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:7px 0;border-top:1px dashed #cfc8b8}.a3-r:first-of-type{border-top:0}'+
  '.a3-l{font-family:'+M+';font-weight:700;min-width:24px;white-space:nowrap;margin-right:4px}.a3-n{font-family:'+M+';font-size:13px;margin-left:6px}'+
  '.a3-why{width:100%;font-size:12px;color:#666;padding-left:33px}'+
  '.a3-b{display:inline-flex;width:30px;height:30px;border:1px solid #111;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-family:'+M+';font-size:13px;background:#fff;color:#111}'+
  '.a3-sm{width:24px;height:24px;font-size:11px}.a3-on{background:#111;color:#fff}.a3-off{color:#b5ae9f;border-color:#cfc8b8;background:transparent}'+
  '.a3-chip{font-family:'+M+';font-size:11px;background:#d4f53c;border:1px solid #111;padding:0 6px;margin-left:4px}'+
  '.a3-vs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #111;margin-top:10px}.a3-vs div{padding:8px;text-align:center;font-size:12px;border-left:1px solid #111}.a3-vs div:first-child{border-left:0}'+
  '.a3-vs b{display:block;font-size:22px;font-family:'+M+'}.a3-vs .a3-me{background:#111;color:#fff}'+
  '.a3 table{width:100%;border-collapse:collapse;font-size:13px}.a3 th{font-family:'+M+';font-size:11px;font-weight:400;color:#555;text-align:left;border-bottom:1px solid #111;padding:4px}'+
  '.a3 td{padding:6px 4px;border-bottom:1px dashed #cfc8b8;vertical-align:top;font-family:'+M+'}'+
  '.a3-note{font-size:12px;color:#555}.a3-warn{font-size:12px;border:1px dashed #111;padding:8px 10px;margin-top:10px}'+
  '.a3-more{display:block;font-family:'+M+';font-size:13px;font-weight:700;color:#111;text-decoration:none;border-top:1px solid #111;padding-top:10px;margin-top:12px}'+
  '.a3-bar{height:8px;background:#e6e0d2;position:relative}.a3-bar span{position:absolute;top:0;bottom:0;left:0;background:#111}.a3-bar em{position:absolute;top:-3px;bottom:-3px;left:50%;border-left:1px dashed #c00}';
  function css(){if(!document.getElementById("a3css2")){var s=document.createElement("style");s.id="a3css2";s.textContent=CSS;document.head.appendChild(s)}}
  // 지난 회차 채점 블록 (가젯·페이지 공용)
  function scoreBlock(r,full){var E=esc,h='';
    h+='<div class="a3-r"><span class="a3-l">당첨</span>'+balls(r.win)+'<span class="a3-n">+</span>'+ball(r.bonus,{bonus:1})+'</div>';
    r.sets.forEach(function(s){h+='<div class="a3-r"><span class="a3-l">'+E(s.label)+'</span>'+balls(s.nums,{win:r.win})+'<span class="a3-n">'+s.matches+'개</span>'+(s.rank?'<span class="a3-chip">'+s.rank+'등</span>':'')+'</div>'});
    if(full&&r.rival){h+='<div class="a3-note" style="margin-top:6px">무작위 대조군 5세트</div>';r.rival.forEach(function(s){h+='<div class="a3-r"><span class="a3-l">·</span>'+balls(s.nums,{win:r.win,sm:1})+'<span class="a3-n">'+s.matches+'개</span></div>'})}
    h+='<div class="a3-vs"><div class="a3-me">AI 5세트<b>'+r.ai_total+'</b></div><div>무작위 5세트<b>'+r.rival_total+'</b></div><div>수학적 기대값<b>4</b></div></div>';
    return h}
  return {esc:esc,ball:ball,balls:balls,get:get,css:css,date:date,scoreBlock:scoreBlock};
})();
(function(){
  AI365.css();var el=document.getElementById("a3-page"),E=AI365.esc,B=AI365.balls;
  Promise.all([AI365.get("latest_picks.json"),AI365.get("scorecard.json")]).then(function(r){
    var d=r[0],sc=r[1],h='';
    if(d.next){var n=d.next;h+='<div class="a3-box"><div class="a3-k"><span>이번 주 AI 실험 번호</span><span>로직 '+E(n.version)+' · 공개 '+E(n.generated_at)+'</span></div>'+
      '<div class="a3-h">제'+n.draw+'회<small>'+AI365.date(n.draw_date)+' 추첨 예정</small></div>';
      n.sets.forEach(function(s){h+='<div class="a3-r"><span class="a3-l">'+E(s.label)+'</span>'+B(s.nums)+'<span class="a3-why">'+E(s.reason)+'</span></div>'});
      h+='<div class="a3-note" style="margin-top:8px">공개 시각 증거: <a href="https://github.com/codekimmy/lotto-ai365lab/commits/main/ai-picks/data/picks" target="_blank" rel="noopener">GitHub 커밋 기록</a> · 공개 후에는 고치지 않습니다.</div></div>';}
    var lv=sc.live;
    h+='<div class="a3-box"><div class="a3-k"><span>누적 성적표 · AI 대 무작위</span><span>'+(lv?'실전 '+lv.draws+'회 · '+lv.tickets+'장':'기록 시작 전')+'</span></div>';
    if(lv){var rs=function(o){var t=0;for(var k in o)t+=o[k];return t};
      h+='<table><tr><th></th><th>AI</th><th>무작위</th><th>기대값</th></tr><tr><td>1장당 평균 일치</td><td><b>'+lv.ai_mean_matches+'</b></td><td>'+lv.rival_mean_matches+'</td><td>0.8</td></tr>'+
        '<tr><td>3개 이상(5등↑)</td><td><b>'+lv.ai_hits_3plus+'</b></td><td>'+rs(lv.rival_rank_counts)+'</td><td>'+lv.expected_hits_3plus+'</td></tr>';
      for(var k=1;k<=5;k++)h+='<tr><td>'+k+'등</td><td>'+lv.ai_rank_counts[k]+'</td><td>'+lv.rival_rank_counts[k]+'</td><td>'+lv.expected_rank_counts[k]+'</td></tr>';h+='</table>';}
    if(sc.backtest_summary){var b=sc.backtest_summary;h+='<div class="a3-warn">참고(실전 아님): '+E(sc.backtest_version||'')+'을 1152~1251회에 거꾸로 적용하면 1장당 평균 '+b.ai_mean_matches+'개(무작위 '+b.rival_mean_matches+', 기대 0.8), 3개 이상 '+b.ai_hits_3plus+'장(기대 '+b.expected_hits_3plus+'장). 무작위와 구별되지 않는 수준입니다.</div>';}
    h+='</div>';
    // 회차별 누적 기록
    h+='<div class="a3-box"><div class="a3-k"><span>회차별 기록 · 추천 번호 대 실제 당첨번호</span><span>검정 = 맞은 번호</span></div>';
    if(sc.history.length){sc.history.forEach(function(x,i){
      h+='<div style="'+(i?'border-top:1px solid #111;margin-top:14px;padding-top:12px':'')+'"><div class="a3-h" style="font-size:19px">제'+x.draw+'회<small>로직 '+E(x.version)+'</small></div>'+AI365.scoreBlock(x,true)+'</div>'});}
    else h+='<p class="a3-note">1252회부터 쌓입니다.</p>';
    h+='</div>';
    // 로직 점검 데이터
    var dg=sc.diagnostics;
    if(dg){h+='<div class="a3-box"><div class="a3-k"><span>로직 점검 데이터</span><span>당첨번호의 지표 순위 · 무작위면 50%</span></div><p class="a3-note" style="margin-top:0">'+E(dg.how_to_read)+'</p>'+
      '<table><tr><th>지표</th><th>실전 평균</th><th></th><th>백테스트 100회</th></tr>';
      dg.features.forEach(function(f){var lvv=dg.live_avg?dg.live_avg[f.key]:null,bt=dg.backtest_avg?dg.backtest_avg[f.key]:null;
        h+='<tr><td style="font-family:inherit">'+E(f.label)+'</td><td>'+(lvv==null?'-':'상위 '+lvv+'%')+'</td><td style="width:30%"><div class="a3-bar"><span style="width:'+(lvv==null?0:100-lvv)+'%"></span><em></em></div></td><td>'+(bt==null?'-':'상위 '+bt+'%')+'</td></tr>'});
      h+='</table><p class="a3-note">막대가 빨간 점선(50%)보다 길면 그 지표가 당첨번호 쪽을 가리켰다는 뜻입니다. 한두 회차는 우연이 크니 20회 이상 쌓인 값으로 판단합니다.</p></div>';}
    // 상태·규칙·이력
    var rv=sc.review;h+='<div class="a3-box"><div class="a3-k"><span>로직 상태</span><span>'+E(rv.state)+'</span></div><p class="a3-note" style="margin-top:0">'+E(rv.detail)+'</p><b>재검토 규칙 (최근 '+sc.review_rule.window+'회 기준)</b><ul style="margin:4px 0;padding-left:18px;font-size:13px">';
    sc.review_rule.triggers.forEach(function(t){h+='<li>'+E(t)+'</li>'});
    h+='</ul><p class="a3-note">로직은 최소 '+sc.review_rule.min_draws_between_changes+'회 간격으로만 바꾸고, 옛 버전 기록은 지우지 않습니다. '+E(sc.review_rule.note)+'</p>'+
      '<div class="a3-k" style="margin-top:12px"><span>로직 변경 이력</span><span></span></div><table><tr><th>버전</th><th>적용</th><th>내용</th></tr>';
    sc.changelog.slice().reverse().forEach(function(c){h+='<tr><td>'+E(c.version)+'</td><td>'+c.effective_from+'회~</td><td style="font-family:inherit">'+E(c.note)+'</td></tr>'});
    h+='</table>';
    if(sc.backtest_repeat){var rp=sc.backtest_repeat;h+='<p class="a3-note">주간 반복(백테스트 '+rp.weeks+'주): 지난주 AI 번호가 이번 주에 다시 쓰인 비율 '+rp.reused_share+'% · 지난주 세트와 가장 많이 겹친 개수 평균 '+rp.avg_max_pair_overlap+'개(최대 '+rp.worst_pair_overlap+'개). 무작위로 뽑으면 약 52% · 2.5개입니다.</p>';}
    (sc.withdrawn||[]).forEach(function(w){h+='<div class="a3-warn"><b>제'+w.draw+'회 '+E(w.version)+' 번호 폐기 기록</b> ('+E(w.at)+', 추첨 전)<br>'+E(w.reason)+'<div style="margin-top:6px">'+w.sets.map(function(s){return '<div>'+B(s,{sm:1})+'</div>'}).join('')+'</div></div>'});
    h+='</div>';
    var p=sc.rank_probability_per_ticket;
    h+='<div class="a3-note"><b>'+E(sc.disclaimer)+'</b><br>1장 기준 확률(어떤 번호든 같음): 1등 '+p[1]+' · 2등 '+p[2]+' · 3등 '+p[3]+' · 4등 '+p[4]+' · 5등 '+p[5]+'<br>업데이트 '+E(sc.updated_at)+' · 당첨번호 원본은 동행복권 공식 사이트에서 확인하세요.</div>';
    el.innerHTML=h;
  }).catch(function(){el.textContent="성적표를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."});
})();
</script>
